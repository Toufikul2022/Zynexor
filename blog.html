<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zynexor Blog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Articles on branding, design, social media and product building from the Zynexor team.">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="blog" class="page-light">
<main class="wrap" style="padding-top:140px;padding-bottom:100px">
  <h1 class="h-l center rise">Zynexor Blog</h1>
  <div class="filters" id="filters" role="group" aria-label="Filter articles">
    <button class="on" data-f="All">All</button><button data-f="Branding">Branding</button><button data-f="Design">Design</button><button data-f="Social media">Social media</button><button data-f="Success story">Success story</button>
  </div>
  <div class="featured" id="featured"></div>
  <h2 class="h-s center" style="margin-top:80px">More articles</h2>
  <div class="agrid" id="agrid"></div>
</main>
<div id="foot"></div>
<script src="site.js"></script>
<script>
(function(){
  var A=ZX.ARTICLES,W=ZX.W;
  function small(a){return '<a class="bcard-l" href="article.html#'+a.id+'"><div><span class="meta">'+a.cat+' · '+a.read+'</span><h3>'+a.t+'</h3></div>'+ZX.vid(a.img)+'</a>'}
  function big(a){return '<a class="bcard-big" href="article.html#'+a.id+'"><span class="meta" style="font-size:11px;color:#6b6b6b">'+a.cat+' · '+a.read+'</span><h3>'+a.t+'</h3>'+ZX.vid(a.img)+'</a>'}
  function tile(a){return '<a href="article.html#'+a.id+'">'+ZX.vid(a.img)+'<span class="meta">'+a.cat+' · '+a.read+'</span><h3>'+a.t+'</h3></a>'}
  function render(f){
    var list=f==='All'?A:A.filter(function(a){return a.cat===f});
    var feat=list.slice(0,3);
    document.getElementById('featured').innerHTML=feat.length?'<div class="stack">'+feat.slice(1).map(small).join('')+'</div>'+big(feat[0]):'';
    document.getElementById('featured').style.display=feat.length>1?'':'block';
    var rest=f==='All'?A.slice(3):list;
    document.getElementById('agrid').innerHTML=rest.map(tile).join('');
  }
  document.getElementById('filters').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render(b.getAttribute('data-f'))});
  render('All');
})();
</script>
</body>
</html>
