# Tells Bing (which powers ChatGPT search), Yandex and other IndexNow engines about every page after each deploy.
name: Notify search engines (IndexNow)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel to finish deploying
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY=$(python3 -c "import json,sys;print(json.dumps({'host':'www.zynexor.com','key':'d4b6f35bc6adaf50173cf8d6b2f3fc22','keyLocation':'https://www.zynexor.com/d4b6f35bc6adaf50173cf8d6b2f3fc22.txt','urlList':json.loads(sys.argv[1])}))" "$URLS")
          curl -sS -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
